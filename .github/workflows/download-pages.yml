name: Deploy desktop download page

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/public/download.html'
      - 'apps/web/public/download-release.json'
      - 'apps/web/public/desktop-preview.png'
      - 'apps/web/public/download-assets/**'
      - 'apps/web/public/icons/favicon-32x32.png'
      - 'scripts/package-download-page.cjs'
      - '.github/workflows/download-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package download page
        run: node scripts/package-download-page.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/download-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
